services:
  db:
    image: postgres:16-alpine
    container_name: peersupport_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: peersupport
      POSTGRES_USER: peersupport
      POSTGRES_PASSWORD: peersupport_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peersupport -d peersupport"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
