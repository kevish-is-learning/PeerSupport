name: Backend Deploy

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend

    # Only deploy when CI passed on a push to main (not on PR runs).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Production .env
        env:
          PROD_ENV: ${{ secrets.BACKEND_ENV }}
        run: |
          printf '%s\n' "$PROD_ENV" > .env

      - name: Restore Google Credential Files
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_TOKEN_JSON: ${{ secrets.GOOGLE_CALENDAR_TOKEN_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
          fi
          if [ -n "$GOOGLE_CALENDAR_TOKEN_JSON" ]; then
            printf '%s' "$GOOGLE_CALENDAR_TOKEN_JSON" > google-calendar-token.json
          fi

      - name: Create Deployment Package
        run: |
          tar \
            --exclude=node_modules \
            --exclude=.git \
            -czf /tmp/backend.tar.gz \
            .
          mv /tmp/backend.tar.gz ./backend.tar.gz

      - name: Upload Deployment Package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: backend/backend.tar.gz
          target: "~/apps/peersupport-backend"
          strip_components: 1

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            source ~/.bash_profile 2>/dev/null || source ~/.profile 2>/dev/null || source ~/.bashrc 2>/dev/null || true
            export PATH="$PATH:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin"

            APP_DIR="$HOME/apps/peersupport-backend"
            APP_NAME="peersupport-api"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Clear tracked source so renamed/deleted files don't linger.
            # Keep: node_modules, .env, google-*.json, public/uploads
            rm -rf src prisma scripts public \
                   package.json package-lock.json prisma.config.js \
                   docker-compose.yml .dockerignore README.md

            tar -xzf backend.tar.gz
            rm -f backend.tar.gz

            npm ci --omit=dev

            # Start / refresh the local Postgres only if the compose file is used.
            # If DATABASE_URL points at a managed DB (e.g. Neon), this is a no-op you can delete.
            if [ -f docker-compose.yml ]; then
              docker compose up -d
              echo "Waiting for PostgreSQL..."
              for i in $(seq 1 30); do
                if docker compose exec -T db pg_isready >/dev/null 2>&1; then
                  echo "PostgreSQL is ready."
                  break
                fi
                sleep 2
              done
            fi

            npx prisma generate
            npx prisma migrate deploy

            pm2 reload "$APP_NAME" --update-env || pm2 start src/server.js --name "$APP_NAME"
            pm2 save

            # Smoke test
            PORT_VALUE="$(grep -E '^PORT=' .env | head -1 | cut -d= -f2 | tr -d '\"'"'"' ')"
            PORT_VALUE="${PORT_VALUE:-8080}"
            sleep 3
            curl -fsS "http://127.0.0.1:${PORT_VALUE}/api/health" && echo "Health check passed."
